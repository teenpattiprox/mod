<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile Card</title>

  <style>
    body {
      margin: 0;
      padding: 10px;
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 360px;
      background: #262626;
      border-radius: 20px;
      text-align: center;
      color: white;
      padding: 100px 10px 100px;
      position: relative;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    /* avatar */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #d9c4b6;
      padding: 6px;
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .name {
      margin-top: 10px;
      font-size: 30px;
      font-weight: 800;
    }

    .first { color: #0aa8ff; } 
    .last  { color: white; }

    .title {
      margin-top: 8px;
      font-size: 18px;
      color: white;
      font-weight: bold;
    }

    .desc {
      margin-top: 18px;
      font-size: 16px;
      color: #e4e4e4;
      line-height: 1.4;
      padding: 0 10px;
    }

    /* RED WAVE */
    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      overflow: hidden;
      border-radius: 0 0 20px 20px;
    }

    .wave svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">
      <img src="./Dev.jpg" alt="">
    </div>

    <div class="name">
      <span class="first">Mr</span> <span class="last">Sikko</span>
    </div>

    <div class="title">3Patti Hacker</div>

    <p class="desc">
     Download App And Enjoy 
     
    </p>

    <!-- RED WAVE -->
    <div class="wave">
      <svg viewBox="0 0 500 150" preserveAspectRatio="none">
        <path d="M0,30 C120,110 220,-20 500,70 L500,150 L0,150 Z" fill="#ff0000"></path>
      </svg>
    </div>

  </div>

</body>
</html>
